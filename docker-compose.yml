services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: novatech
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: novatech_shop
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novatech -d novatech_shop"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: ${DOCKER_USERNAME}/trung-shop-api:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 8000
      CLIENT_URL: http://${SERVER_HOST}
      DATABASE_URL: postgresql://novatech:${POSTGRES_PASSWORD}@db:5432/novatech_shop
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: 7d
    command: sh -c "npx prisma db push && node src/server.js"

  web:
    image: ${DOCKER_USERNAME}/trung-shop-fe:latest
    restart: always
    depends_on:
      - api
    ports:
      - "80:80"

volumes:
  pgdata: